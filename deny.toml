# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Every advisory below is pulled in transitively by the Solana SDK / RPC client
# (solana-sdk, solana-rpc-client) and cannot be resolved at this layer without an
# upstream Solana dependency bump. Reviewed and accepted; revisit and drop entries
# as Solana updates its tree.
ignore = [
  # Unmaintained transitive crates.
  "RUSTSEC-2024-0375", # atty
  "RUSTSEC-2025-0141", # bincode
  "RUSTSEC-2024-0388", # derivative
  "RUSTSEC-2025-0057", # fxhash
  "RUSTSEC-2025-0161", # libsecp256k1
  "RUSTSEC-2025-0119", # number_prefix
  "RUSTSEC-2024-0436", # paste
  "RUSTSEC-2024-0370", # proc-macro-error / proc-macro-error2
  "RUSTSEC-2026-0173", # transitive unmaintained crate
  # Transitive vulnerabilities (Solana crypto + RPC client networking/TLS).
  "RUSTSEC-2022-0093", # ed25519-dalek: double public key signing oracle
  "RUSTSEC-2024-0344", # curve25519-dalek: timing variability in Scalar sub
  "RUSTSEC-2026-0007", # bytes: integer overflow in BytesMut::reserve
  "RUSTSEC-2026-0037", # quinn: denial of service in endpoints
  "RUSTSEC-2026-0185", # quinn-proto: remote memory exhaustion
  "RUSTSEC-2026-0098", # rustls-webpki: URI name constraints
  "RUSTSEC-2026-0099", # rustls-webpki: wildcard name constraints
  "RUSTSEC-2026-0104", # rustls-webpki: CRL parsing
  "RUSTSEC-2026-0049", # rustls-webpki / certificate validation
  "RUSTSEC-2026-0067", # tar: unpack_in chmod via symlink
  "RUSTSEC-2026-0068", # tar-rs: PAX size headers
  "RUSTSEC-2026-0009", # transitive denial of service (stack exhaustion)
]

[licenses]
version = 2
# Permissive licenses present in the dependency tree.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# Duplicate crate versions are unavoidable in the Solana dependency tree; surface
# them without failing the build.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
