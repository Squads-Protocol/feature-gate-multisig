name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # hidapi (via solana-remote-wallet) needs libudev to build on Linux.
      - name: Install system deps
        run: sudo apt-get install -y libudev-dev

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Format
        run: cargo fmt --all --check

      # --all-targets compile-checks the E2E tests too; they need a live surfpool
      # validator to run, so they are not executed here.
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # Plain `cargo test` must be self-contained: the surfpool E2E tests are
      # #[ignore]d and only run via `make test-surfpool` (the e2e job).
      - name: Unit tests
        run: cargo test --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          command: check

  e2e:
    name: e2e (surfpool)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    env:
      SURFPOOL_VERSION: v1.4.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # hidapi (via solana-remote-wallet) needs libudev to build on Linux.
      - name: Install system deps
        run: sudo apt-get install -y libudev-dev

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Install surfpool
        run: |
          set -euo pipefail
          url="https://github.com/txtx/surfpool/releases/download/${SURFPOOL_VERSION}/surfpool-linux-x64.tar.gz"
          curl -fsSL "$url" -o surfpool.tar.gz
          tar -xzf surfpool.tar.gz
          sudo install -m 755 surfpool /usr/local/bin/surfpool
          surfpool --version

      # surfpool clones the Squads program from mainnet on startup, so this job
      # needs outbound network access.
      - name: E2E tests
        run: make test-surfpool

      - name: Upload surfpool log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: surfpool-log
          path: artifacts/surfpool.log
          if-no-files-found: ignore
